name: "🎙️ Swift CI"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "🧪 Build & test"
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🧭 Show toolchain"
        run: |
          swift --version
          xcodebuild -version

      - name: "📦 Resolve dependencies"
        run: swift package resolve

      - name: "🔨 Build application and tests"
        run: swift build --build-tests -Xswiftc -warnings-as-errors -v

      - name: "✅ Run tests"
        run: swift test --skip-build

  thread-sanitizer:
    name: "🧵 Thread sanitizer"
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🧵 Run tests with Thread Sanitizer"
        run: swift test --sanitize=thread

  package-app:
    name: "📦 Package app"
    needs: [build-and-test, thread-sanitizer]
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v7

      - name: "🧱 Build signed app bundle"
        run: make app

      - name: "🔍 Verify app bundle"
        run: |
          test -x .build/VoiceActivation.app/Contents/MacOS/VoiceActivation
          test -f .build/VoiceActivation.app/Contents/Resources/CaptureStart.wav
          test -f .build/VoiceActivation.app/Contents/Resources/CaptureEnd.wav
          plutil -lint .build/VoiceActivation.app/Contents/Info.plist
          codesign --verify --deep --strict .build/VoiceActivation.app
